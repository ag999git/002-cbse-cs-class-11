site_name: Computer Science with Python – CBSE Class XI
site_url: https://ag999git.github.io/002-cbse-cs-class-11/
repo_url: https://github.com/ag999git/002-cbse-cs-class-11
docs_dir: book
use_directory_urls: true
theme:
  name: material
  language: en
  palette:
    - scheme: default
      primary: deep orange
      accent: deep orange
      toggle: {icon: material/brightness-7, name: Dark mode}
    - scheme: slate
      primary: deep orange
      accent: deep orange
      toggle: {icon: material/brightness-4, name: Light mode}
  features: [navigation.indexes, navigation.sections, navigation.top, search.suggest, content.code.copy]
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc: {permalink: true}
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.arithmatex: {generic: true}
plugins:
  - search
  - redirects:
      redirect_maps:
        'q/0101.md': 'unit-1/001-ch01-computer-system-organisation/index.md'
        'q/0102.md': 'unit-1/001-ch01-computer-system-organisation/beyond-types-and-history.md'
        'q/0103.md': 'unit-1/001-ch01-computer-system-organisation/see-it-device-gallery.md'
        'q/0104.md': 'unit-1/001-ch01-computer-system-organisation/sometimes-asked-word-size-and-buses.md'
        'q/0105.md': 'unit-1/001-ch01-computer-system-organisation/sometimes-asked-types-of-rom-ram.md'
        'q/0106.md': 'unit-1/001-ch01-computer-system-organisation/see-it-inside-the-computer.md'
        'q/0107.md': 'unit-1/001-ch01-computer-system-organisation/beyond-memory-hierarchy.md'
        'q/0108.md': 'unit-1/001-ch01-computer-system-organisation/challenge-units-of-memory.md'
        'q/0109.md': 'unit-1/001-ch01-computer-system-organisation/questions/index.md'
        'q/0110.md': 'unit-1/001-ch01-computer-system-organisation/flashcards.md'
